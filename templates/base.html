{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sprint Wash - Panel Administrativo</title>
    
    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    
    <!-- Tu CSS Personalizado (Debe ir DEBAJO de Bootstrap para sobreescribirlo) -->
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>

    <!-- Barra de Navegación Superior -->
    <nav class="navbar navbar-dark navbar-sprint shadow-sm">
        <div class="container-fluid">
            <!-- Si tienes el logo en static/img/, usas esto: 
                 <img src="{% static 'img/logo.png' %}" alt="Logo" height="40"> 
            -->
            <a class="navbar-brand fw-bold" href="#">
                <i class="bi bi-droplet-fill"></i> SPRINT WASH
            </a>
            
            <div class="d-flex text-white align-items-center">
                <span class="me-3">Admin: Don Edwin</span>
                <button class="btn btn-sm btn-outline-light">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <!-- Contenedor Principal (Aquí inyectaremos las otras pantallas) -->
    <div class="container-fluid mt-4">
        {% block content %}
        <!-- El contenido de operaciones, login o catálogos aparecerá aquí -->
        {% endblock %}
    </div>

    <!-- Bootstrap JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
