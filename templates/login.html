{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sprint Wash</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100">

    <div class="card card-sprint p-5" style="width: 100%; max-width: 400px;">
        
        <!-- Logo -->
        <div class="text-center mb-4">
            <img src="{% static '../static/img/Sprint Wash Logo.png' %}" alt="Logo Sprint Wash" class="img-fluid mx-auto d-block" style="max-width: 200px;">
            <p class="text-sprint fw-bold mt-3 mb-0" style="font-size: 0.75rem; letter-spacing: 1.5px;">BIENVENIDO DE NUEVO</p>
        </div>

        <form>
            <!-- Correo electrónico -->
            <div class="mb-4 text-start">
                <label class="label-sprint">Correo electrónico</label>
                <div class="input-group input-sprint-container">
                    <span class="input-group-text"><i class="bi bi-envelope text-muted"></i></span>
                    <input type="email" class="form-control" placeholder="alex@nexo.app">
                </div>
            </div>

            <!-- Contraseña -->
            <div class="mb-3 text-start">
                <label class="label-sprint">Contraseña</label>
                <div class="input-group input-sprint-container">
                    <span class="input-group-text"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" class="form-control" placeholder="Contraseña">
                    <span class="input-group-text pe-3"><i class="bi bi-eye text-muted" style="cursor: pointer;"></i></span>
                </div>
            </div>

            <!-- Olvidaste contraseña -->
            <div class="d-flex justify-content-end mb-4">
                <a href="#" class="text-sprint text-decoration-none fw-semibold" style="font-size: 0.8rem;">¿Olvidaste tu contraseña?</a>
            </div>

            <!-- Botón Principal Flotante -->
            <button type="submit" class="btn btn-primary w-100 py-3 mb-4 d-flex justify-content-center align-items-center gap-2">
                <span>Iniciar sesión</span>
                <i class="bi bi-arrow-right"></i>
            </button>

            <!-- Crear cuenta -->
            <p class="text-muted text-center mb-0" style="font-size: 0.85rem;">
                ¿Aún no tienes cuenta? <a href="#" class="text-sprint fw-bold text-decoration-none">Crear cuenta</a>
            </p>
        </form>
    </div>

</body>
</html>
