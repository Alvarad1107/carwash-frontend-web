{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sprint Wash</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="{% static 'css/style.css' %}?v=2.1" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center vh-100 px-3">

    <div class="card card-sprint p-4 p-sm-5" style="width: 100%; max-width: 410px;">
        
        <!-- Logo y Encabezado -->
        <div class="text-center mb-4">
            <img src="{% static 'img/Sprint Wash Logo.png' %}" alt="Logo Sprint Wash" class="img-fluid mx-auto d-block mb-3" style="max-width: 165px;">
            <h5 class="fw-bold text-dark mb-1">Panel Administrativo</h5>
            <p class="text-muted small mb-0">Ingresa tus credenciales de acceso</p>
        </div>

        {% if messages %}
            {% for message in messages %}
            <div class="alert {% if message.tags == 'error' %}alert-danger{% else %}alert-success{% endif %} py-2 px-3 small rounded-3 text-center mb-3 border-0">
                <i class="bi {% if message.tags == 'error' %}bi-exclamation-circle-fill{% else %}bi-check-circle-fill{% endif %} me-1"></i>{{ message }}
            </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <!-- Correo electrónico -->
            <div class="mb-3 text-start">
                <label class="label-sprint">Correo electrónico</label>
                <div class="input-group input-sprint-container">
                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                    <input type="email" name="correo" class="form-control" placeholder="nombre.apellido@sprintwash.local" required>
                </div>
            </div>

            <!-- Contraseña -->
            <div class="mb-4 text-start">
                <label class="label-sprint">Contraseña</label>
                <div class="input-group input-sprint-container">
                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                    <input type="password" name="password" id="inputPasswordLogin" class="form-control" placeholder="••••••••" required>
                    <span class="input-group-text pe-3" id="btnTogglePass" style="cursor: pointer;">
                        <i class="bi bi-eye"></i>
                    </span>
                </div>
            </div>

            <!-- Botón Principal -->
            <button type="submit" class="btn btn-primary w-100 py-2 d-flex justify-content-center align-items-center gap-2">
                <span>Iniciar sesión</span>
                <i class="bi bi-arrow-right"></i>
            </button>
        </form>
    </div>

    <script>
        document.getElementById('btnTogglePass').addEventListener('click', function() {
            const input = document.getElementById('inputPasswordLogin');
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });
    </script>
</body>
</html>
